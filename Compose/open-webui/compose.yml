services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_VERSION}
    container_name: open-webui
    restart: unless-stopped

    environment:
      # Öffentliche Adresse; muss vor dem ersten Start gesetzt sein.
      WEBUI_URL: https://webui.${DOMAIN}
      # Browseranfragen ausschließlich von der eigenen öffentlichen Oberfläche.
      CORS_ALLOW_ORIGIN: https://webui.${DOMAIN}

      # Ausschließlich die interne Ollama-Adresse im Docker-Netzwerk.
      OLLAMA_BASE_URL: http://ollama:11434
      ENABLE_OPENAI_API: "false"
      ENABLE_VERSION_UPDATE_CHECK: "false"

      # Ausschließlich nativer OIDC-Login über Authentik.
      ENABLE_LOGIN_FORM: "false"
      ENABLE_PASSWORD_AUTH: "false"
      ENABLE_SIGNUP: "false"
      ENABLE_OAUTH: "true"
      ENABLE_OAUTH_SIGNUP: "true"
      OAUTH_AUTO_REDIRECT: "true"
      ENABLE_OAUTH_PERSISTENT_CONFIG: "false"
      OAUTH_CLIENT_ID: ${OPENWEBUI_OIDC_CLIENT_ID:-}
      OAUTH_CLIENT_SECRET: ${OPENWEBUI_OIDC_CLIENT_SECRET:-}
      OPENID_PROVIDER_URL: https://auth.${DOMAIN}/application/o/open-webui/.well-known/openid-configuration
      OPENID_REDIRECT_URI: https://webui.${DOMAIN}/oauth/oidc/callback
      OAUTH_SCOPES: openid email profile roles
      OAUTH_PROVIDER_NAME: Authentik
      OAUTH_USERNAME_CLAIM: name
      OAUTH_EMAIL_CLAIM: email
      OAUTH_GROUP_CLAIM: groups
      ENABLE_OAUTH_ROLE_MANAGEMENT: "true"
      OAUTH_ROLES_CLAIM: roles
      OAUTH_ALLOWED_ROLES: user,admin
      OAUTH_ADMIN_ROLES: admin

      # Persistenter Signierschlüssel und sichere Cookies für HTTPS.
      WEBUI_SECRET_KEY_FILE: /run/secrets/openwebui_secret_key
      WEBUI_SESSION_COOKIE_SECURE: "true"
      WEBUI_AUTH_COOKIE_SECURE: "true"
      WEBUI_SESSION_COOKIE_SAME_SITE: lax
      WEBUI_AUTH_COOKIE_SAME_SITE: lax

    secrets:
      - openwebui_secret_key

    volumes:
      - openwebui_data:/app/backend/data

    expose:
      - "8080"

    networks:
      - web

    healthcheck:
      test:
        - CMD-SHELL
        - curl --silent --fail http://localhost:8080/health | jq -ne 'input.status == true' || exit 1
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 5

    labels:
      - traefik.enable=true
      - traefik.docker.network=web

      - traefik.http.routers.open-webui.rule=Host(`webui.${DOMAIN}`)
      - traefik.http.routers.open-webui.entrypoints=websecure
      - traefik.http.routers.open-webui.tls=true
      - traefik.http.routers.open-webui.tls.certresolver=letsencrypt
      - traefik.http.services.open-webui.loadbalancer.server.port=8080

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  web:
    external: true
    name: web

volumes:
  openwebui_data:
    name: openwebui_data

secrets:
  openwebui_secret_key:
    file: ./secrets/openwebui_secret_key
