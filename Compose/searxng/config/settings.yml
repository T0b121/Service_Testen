# Lokale Ergänzungen zu den SearXNG-Standardwerten.
use_default_settings: true

general:
  debug: false
  instance_name: "SearXNG"

search:
  safe_search: 2
  autocomplete: "duckduckgo"
  # json wird ausschließlich für interne Clients wie Open WebUI benötigt.
  formats:
    - html
    - json

server:
  # Der effektive Wert kommt aus SEARXNG_SECRET in der lokalen .env.
  secret_key: "change-me"
  limiter: true
  image_proxy: true
  public_instance: false

valkey:
  # Der effektive Wert kommt aus SEARXNG_VALKEY_URL.
  url: valkey://searxng-valkey:6379/0
