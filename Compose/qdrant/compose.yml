services:
  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION}
    container_name: qdrant
    restart: unless-stopped

    environment:
      # Qdrant hat keine native *_FILE-Variable für diesen Schlüssel.
      # Die lokale .env ist deshalb ausschließlich lokal und auf 0600 gesetzt.
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY must be set in .env}

    volumes:
      - qdrant_storage:/qdrant/storage

    expose:
      - "6333" # REST API und Dashboard
      - "6334" # gRPC nur für interne Clients

    networks:
      - web
      - qdrant_clients

    healthcheck:
      # Das schlanke offizielle Image enthält weder curl noch wget.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    labels:
      - traefik.enable=true
      - traefik.docker.network=web

      # Das Dashboard verwendet dieselbe REST-Adresse. Der gesamte Browserzugriff
      # ist daher über Authentik geschützt; es gibt keinen ungeschützten API-Host.
      # Qdrants Basisroute liefert nur API-Metadaten und wird deshalb auf die UI
      # unter /dashboard/ umgeleitet.
      - traefik.http.routers.qdrant.rule=Host(`qdrant.${DOMAIN}`)
      - traefik.http.routers.qdrant.entrypoints=websecure
      - traefik.http.routers.qdrant.tls=true
      - traefik.http.routers.qdrant.tls.certresolver=letsencrypt
      - traefik.http.routers.qdrant.middlewares=authentik@docker,qdrant-dashboard@docker
      - traefik.http.routers.qdrant.service=qdrant

      - traefik.http.routers.authentik-outpost-qdrant.rule=Host(`qdrant.${DOMAIN}`) && PathPrefix(`/outpost.goauthentik.io/`)
      - traefik.http.routers.authentik-outpost-qdrant.entrypoints=websecure
      - traefik.http.routers.authentik-outpost-qdrant.tls=true
      - traefik.http.routers.authentik-outpost-qdrant.tls.certresolver=letsencrypt
      - traefik.http.routers.authentik-outpost-qdrant.service=authentik@docker
      - traefik.http.routers.authentik-outpost-qdrant.priority=100

      - traefik.http.services.qdrant.loadbalancer.server.port=6333
      - traefik.http.middlewares.qdrant-dashboard.redirectregex.regex=^https?://qdrant\.${DOMAIN}/$$
      - traefik.http.middlewares.qdrant-dashboard.redirectregex.replacement=https://qdrant.${DOMAIN}/dashboard/
      - traefik.http.middlewares.qdrant-dashboard.redirectregex.permanent=false

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  web:
    external: true
    name: web

  # Spätere KI-Dienste treten diesem Netz für die direkte Qdrant-API bei.
  qdrant_clients:
    external: true
    name: qdrant_clients

volumes:
  qdrant_storage:
    name: qdrant_storage
