services:
  flowise-postgresql:
    image: postgres:${POSTGRES_VERSION}
    container_name: flowise-postgresql
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    environment:
      POSTGRES_DB: ${FLOWISE_POSTGRES_DB:?FLOWISE_POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${FLOWISE_POSTGRES_USER:?FLOWISE_POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${FLOWISE_POSTGRES_PASSWORD:?FLOWISE_POSTGRES_PASSWORD must be set in .env}

    volumes:
      - flowise_postgresql_data:/var/lib/postgresql

    networks:
      - flowise_internal

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d \"$${POSTGRES_DB}\" -U \"$${POSTGRES_USER}\""]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  flowise:
    image: flowiseai/flowise:${FLOWISE_VERSION}
    container_name: flowise
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    environment:
      PORT: "3000"
      APP_URL: https://flowise.${DOMAIN}
      DATABASE_TYPE: postgres
      DATABASE_PORT: "5432"
      DATABASE_HOST: flowise-postgresql
      DATABASE_NAME: ${FLOWISE_POSTGRES_DB:?FLOWISE_POSTGRES_DB must be set in .env}
      DATABASE_USER: ${FLOWISE_POSTGRES_USER:?FLOWISE_POSTGRES_USER must be set in .env}
      DATABASE_PASSWORD: ${FLOWISE_POSTGRES_PASSWORD:?FLOWISE_POSTGRES_PASSWORD must be set in .env}
      DATABASE_SSL: "false"

      # Persistenter Schlüssel für verschlüsselte Flowise-Credentials.
      FLOWISE_SECRETKEY_OVERWRITE: ${FLOWISE_SECRETKEY_OVERWRITE:?FLOWISE_SECRETKEY_OVERWRITE must be set in .env}
      SECRETKEY_PATH: /home/node/.flowise
      BLOB_STORAGE_PATH: /home/node/.flowise/storage
      LOG_PATH: /home/node/.flowise/logs

      # Lokaler Flowise-Initialzugang; die Weboberfläche ist zusätzlich durch
      # Authentik Forward Auth geschützt.
      FLOWISE_USERNAME: ${FLOWISE_USERNAME:?FLOWISE_USERNAME must be set in .env}
      FLOWISE_PASSWORD: ${FLOWISE_PASSWORD:?FLOWISE_PASSWORD must be set in .env}
      JWT_AUTH_TOKEN_SECRET: ${FLOWISE_JWT_AUTH_TOKEN_SECRET:?FLOWISE_JWT_AUTH_TOKEN_SECRET must be set in .env}
      JWT_REFRESH_TOKEN_SECRET: ${FLOWISE_JWT_REFRESH_TOKEN_SECRET:?FLOWISE_JWT_REFRESH_TOKEN_SECRET must be set in .env}
      EXPRESS_SESSION_SECRET: ${FLOWISE_EXPRESS_SESSION_SECRET:?FLOWISE_EXPRESS_SESSION_SECRET must be set in .env}
      TOKEN_HASH_SECRET: ${FLOWISE_TOKEN_HASH_SECRET:?FLOWISE_TOKEN_HASH_SECRET must be set in .env}
      SECURE_COOKIES: "true"
      TRUST_PROXY: "1"
      NUMBER_OF_PROXIES: "1"

      DISABLE_FLOWISE_TELEMETRY: "true"
      HTTP_SECURITY_CHECK: "true"
      CUSTOM_MCP_SECURITY_CHECK: "true"
      CUSTOM_MCP_PROTOCOL: sse

    volumes:
      - flowise_data:/home/node/.flowise

    expose:
      - "3000"

    networks:
      - web
      - flowise_internal
      - qdrant_clients
      - neo4j_clients

    depends_on:
      flowise-postgresql:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/ping"]
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 5

    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.flowise.rule=Host(`flowise.${DOMAIN}`)
      - traefik.http.routers.flowise.entrypoints=websecure
      - traefik.http.routers.flowise.tls=true
      - traefik.http.routers.flowise.tls.certresolver=letsencrypt
      - traefik.http.routers.flowise.middlewares=authentik@docker
      - traefik.http.routers.flowise.service=flowise

      - traefik.http.routers.authentik-outpost-flowise.rule=Host(`flowise.${DOMAIN}`) && PathPrefix(`/outpost.goauthentik.io/`)
      - traefik.http.routers.authentik-outpost-flowise.entrypoints=websecure
      - traefik.http.routers.authentik-outpost-flowise.tls=true
      - traefik.http.routers.authentik-outpost-flowise.tls.certresolver=letsencrypt
      - traefik.http.routers.authentik-outpost-flowise.service=authentik@docker
      - traefik.http.routers.authentik-outpost-flowise.priority=1000

      - traefik.http.services.flowise.loadbalancer.server.port=3000

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  web:
    external: true
    name: web
  qdrant_clients:
    external: true
    name: qdrant_clients
  neo4j_clients:
    external: true
    name: neo4j_clients
  flowise_internal:
    name: flowise_internal
    internal: true

volumes:
  flowise_postgresql_data:
    name: flowise_postgresql_data
  flowise_data:
    name: flowise_data
    external: true
