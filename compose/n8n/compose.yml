services:
  n8n-postgresql:
    image: postgres:${POSTGRES_VERSION}
    container_name: n8n-postgresql
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    environment:
      POSTGRES_DB: ${N8N_POSTGRES_DB:?N8N_POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${N8N_POSTGRES_USER:?N8N_POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${N8N_POSTGRES_PASSWORD:?N8N_POSTGRES_PASSWORD must be set in .env}
    volumes:
    - n8n_postgresql_data:/var/lib/postgresql
    networks:
    - n8n_internal
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -d "$${POSTGRES_DB}" -U "$${POSTGRES_USER}"
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  n8n:
    image: n8nio/n8n:${N8N_VERSION}
    container_name: n8n
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    environment:
      NODE_ENV: production
      TZ: Europe/Berlin
      GENERIC_TIMEZONE: Europe/Berlin
      N8N_HOST: n8n.${DOMAIN}
      N8N_PROTOCOL: https
      N8N_PORT: '5678'
      N8N_EDITOR_BASE_URL: https://n8n.${DOMAIN}/
      N8N_WEBHOOK_URL: https://n8n.${DOMAIN}/
      N8N_PROXY_HOPS: '1'
      N8N_SECURE_COOKIE: 'true'
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgresql
      DB_POSTGRESDB_PORT: '5432'
      DB_POSTGRESDB_DATABASE: ${N8N_POSTGRES_DB:?N8N_POSTGRES_DB must be set in .env}
      DB_POSTGRESDB_USER: ${N8N_POSTGRES_USER:?N8N_POSTGRES_USER must be set in .env}
      DB_POSTGRESDB_PASSWORD: ${N8N_POSTGRES_PASSWORD:?N8N_POSTGRES_PASSWORD must be set in .env}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY must be set in .env}
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?N8N_RUNNERS_AUTH_TOKEN must be set in .env}
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_TASK_TIMEOUT: '60'
      N8N_NATIVE_PYTHON_RUNNER: 'true'
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_TEMPLATES_ENABLED: 'false'
      N8N_UNVERIFIED_PACKAGES_ENABLED: 'false'
      N8N_PUBLIC_API_DISABLED: 'true'
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'true'
      N8N_RESTRICT_FILE_ACCESS_TO: /home/node/.n8n/files
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: '268435456'
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: '1000'
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: '168'
      N8N_INSTANCE_AI_SEARXNG_URL: http://searxng-internal:8080
    volumes:
    - n8n_data:/home/node/.n8n
    expose:
    - '5678'
    networks:
    - web
    - n8n_internal
    - qdrant_clients
    - neo4j_clients
    - searxng_clients
    depends_on:
      n8n-postgresql:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - --quiet
      - http://localhost:5678/healthz
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      traefik.enable: 'true'
      traefik.docker.network: web
      traefik.http.routers.n8n.rule: Host(`n8n.${DOMAIN}`)
      traefik.http.routers.n8n.entrypoints: websecure
      traefik.http.routers.n8n.tls: 'true'
      traefik.http.routers.n8n.tls.certresolver: letsencrypt
      traefik.http.routers.n8n.middlewares: authentik@docker
      traefik.http.routers.n8n.service: n8n
      traefik.http.routers.authentik-outpost-n8n.rule: Host(`n8n.${DOMAIN}`) && PathPrefix(`/outpost.goauthentik.io/`)
      traefik.http.routers.authentik-outpost-n8n.entrypoints: websecure
      traefik.http.routers.authentik-outpost-n8n.tls: 'true'
      traefik.http.routers.authentik-outpost-n8n.tls.certresolver: letsencrypt
      traefik.http.routers.authentik-outpost-n8n.service: authentik@docker
      traefik.http.routers.authentik-outpost-n8n.priority: '1000'
      traefik.http.services.n8n.loadbalancer.server.port: '5678'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  n8n-runners:
    image: n8nio/runners:${N8N_VERSION}
    container_name: n8n-runners
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?N8N_RUNNERS_AUTH_TOKEN must be set in .env}
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: '15'
    networks:
    - n8n_internal
    depends_on:
      n8n:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - --quiet
      - http://127.0.0.1:5680/healthz
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  web:
    external: true
    name: web
  qdrant_clients:
    external: true
    name: qdrant_clients
  neo4j_clients:
    external: true
    name: neo4j_clients
  searxng_clients:
    external: true
    name: searxng_clients
  n8n_internal:
    name: n8n_internal
    internal: true
volumes:
  n8n_postgresql_data:
    name: managed_n8n_postgresql_data
  n8n_data:
    name: managed_n8n_data
