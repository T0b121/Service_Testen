services:
  litellm-postgresql:
    image: postgres:${POSTGRES_VERSION}
    container_name: litellm-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LITELLM_POSTGRES_DB}
      POSTGRES_USER: ${LITELLM_POSTGRES_USER}
      POSTGRES_PASSWORD: ${LITELLM_POSTGRES_PASSWORD}
    volumes:
    - litellm_postgresql_data:/var/lib/postgresql
    networks:
    - litellm_internal
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -d "$${POSTGRES_DB}" -U "$${POSTGRES_USER}"
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  litellm:
    image: ghcr.io/berriai/litellm:${LITELLM_VERSION}
    container_name: litellm
    restart: unless-stopped
    command: --config /app/config.yaml --port 4000
    environment:
      DATABASE_URL: postgresql://${LITELLM_POSTGRES_USER}:${LITELLM_POSTGRES_PASSWORD}@litellm-postgresql:5432/${LITELLM_POSTGRES_DB}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      PROXY_BASE_URL: https://litellm.${DOMAIN}
      GENERIC_CLIENT_ID: ${LITELLM_OIDC_CLIENT_ID}
      GENERIC_CLIENT_SECRET: ${LITELLM_OIDC_CLIENT_SECRET}
      GENERIC_AUTHORIZATION_ENDPOINT: https://auth.${DOMAIN}/application/o/authorize/
      GENERIC_TOKEN_ENDPOINT: https://auth.${DOMAIN}/application/o/token/
      GENERIC_USERINFO_ENDPOINT: https://auth.${DOMAIN}/application/o/userinfo/
      GENERIC_SCOPE: openid profile email litellm_role
      GENERIC_USER_ID_ATTRIBUTE: sub
      GENERIC_USER_ROLE_ATTRIBUTE: litellm_role
      UI_USERNAME: ${LITELLM_UI_USERNAME}
      UI_PASSWORD: ${LITELLM_UI_PASSWORD}
      STORE_MODEL_IN_DB: 'true'
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_OTEL_HOST: http://langfuse:3000
    volumes:
    - ./config.yaml:/app/config.yaml:ro
    expose:
    - '4000'
    networks:
    - web
    - litellm_internal
    - langfuse_clients
    - neo4j_clients
    depends_on:
      litellm-postgresql:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - /app/.venv/bin/python -c "from urllib.request import urlopen; urlopen('http://localhost:4000/health/liveliness', timeout=5).read()"
      start_period: 40s
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      traefik.enable: 'true'
      traefik.docker.network: web
      traefik.http.routers.litellm-api.rule: Host(`litellm.${DOMAIN}`) && PathPrefix(`/v1`)
      traefik.http.routers.litellm-api.entrypoints: websecure
      traefik.http.routers.litellm-api.tls: 'true'
      traefik.http.routers.litellm-api.tls.certresolver: letsencrypt
      traefik.http.routers.litellm-api.service: litellm
      traefik.http.routers.litellm-api.priority: '100'
      traefik.http.routers.litellm.rule: Host(`litellm.${DOMAIN}`)
      traefik.http.routers.litellm.entrypoints: websecure
      traefik.http.routers.litellm.tls: 'true'
      traefik.http.routers.litellm.tls.certresolver: letsencrypt
      traefik.http.routers.litellm.middlewares: authentik@docker
      traefik.http.routers.litellm.service: litellm
      traefik.http.routers.litellm.priority: '10'
      traefik.http.routers.authentik-outpost-litellm.rule: Host(`litellm.${DOMAIN}`) && PathPrefix(`/outpost.goauthentik.io/`)
      traefik.http.routers.authentik-outpost-litellm.entrypoints: websecure
      traefik.http.routers.authentik-outpost-litellm.tls: 'true'
      traefik.http.routers.authentik-outpost-litellm.tls.certresolver: letsencrypt
      traefik.http.routers.authentik-outpost-litellm.service: authentik@docker
      traefik.http.routers.authentik-outpost-litellm.priority: '1000'
      traefik.http.services.litellm.loadbalancer.server.port: '4000'
      traefik.http.routers.litellm-api.middlewares: authentik@docker
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  web:
    external: true
    name: web
  litellm_internal:
    name: litellm_internal
    internal: true
  langfuse_clients:
    external: true
    name: langfuse_clients
  neo4j_clients:
    external: true
    name: neo4j_clients
volumes:
  litellm_postgresql_data:
    name: managed_litellm_postgresql_data
