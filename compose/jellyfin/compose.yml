services:
  jellyfin:
    image: jellyfin/jellyfin:${JELLYFIN_VERSION}
    container_name: jellyfin
    restart: unless-stopped
    environment:
      JELLYFIN_PublishedServerUrl: https://jellyfin.${DOMAIN}
    volumes:
    - jellyfin_config:/config
    - jellyfin_cache:/cache
    - jellyfin_media:/media:ro
    expose:
    - '8096'
    networks:
    - web
    labels:
      traefik.enable: 'true'
      traefik.docker.network: web
      traefik.http.routers.jellyfin.rule: Host(`jellyfin.${DOMAIN}`)
      traefik.http.routers.jellyfin.entrypoints: websecure
      traefik.http.routers.jellyfin.tls: 'true'
      traefik.http.routers.jellyfin.tls.certresolver: letsencrypt
      traefik.http.routers.jellyfin.middlewares: authentik@docker
      traefik.http.routers.jellyfin.service: jellyfin
      traefik.http.routers.authentik-outpost-jellyfin.rule: Host(`jellyfin.${DOMAIN}`) && PathPrefix(`/outpost.goauthentik.io/`)
      traefik.http.routers.authentik-outpost-jellyfin.entrypoints: websecure
      traefik.http.routers.authentik-outpost-jellyfin.tls: 'true'
      traefik.http.routers.authentik-outpost-jellyfin.tls.certresolver: letsencrypt
      traefik.http.routers.authentik-outpost-jellyfin.service: authentik@docker
      traefik.http.routers.authentik-outpost-jellyfin.priority: '100'
      traefik.http.services.jellyfin.loadbalancer.server.port: '8096'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  web:
    external: true
    name: web
volumes:
  jellyfin_config:
    name: managed_jellyfin_config
  jellyfin_cache:
    name: managed_jellyfin_cache
  jellyfin_media:
    name: managed_jellyfin_media
